<title id="title">БПЛА в ленте KRM РФ: июнь — сентябрь 2026 года</title>
<desc id="desc">В июне 97 публикаций с упоминанием БПЛА, в июле 103, в августе 85, в сентябре 75. Доля во всей экспортированной ленте составила 39,3, 40,2, 39,2 и 35,4 процента соответственно. Это статистика публикаций, а не число атак.</desc>
