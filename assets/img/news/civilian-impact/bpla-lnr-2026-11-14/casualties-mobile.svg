<text x="32" y="42" fill="#173A51" font-size="27" font-weight="700" font-family="Arial,sans-serif" text-anchor="start">Гражданские потери: пять недель</text>
<text x="32" y="69" fill="#66727C" font-size="16" font-weight="400" font-family="Arial,sans-serif" text-anchor="start">По опубликованным недельным сводкам ЛНР</text>
