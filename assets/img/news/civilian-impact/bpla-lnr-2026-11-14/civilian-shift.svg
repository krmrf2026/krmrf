<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="310" viewBox="0 0 1000 310" role="img" aria-labelledby="title desc">
<title id="title">Ключевые этапы гражданских последствий осени</title>
<desc id="desc">Сентябрь: оценка рисков; октябрь: происшествия на дорогах; начало ноября: тяжёлые атаки и перебои; 13 ноября: решение о режиме автобусного движения с 19 ноября.</desc>
<rect x="0" y="0" width="1000" height="310" rx="0" fill="#F7F8F7"/>
<text x="28" y="42" fill="#173A51" font-size="26" font-weight="700" font-family="Arial,sans-serif" text-anchor="start">Как менялся повседневный порядок</text>
<text x="28" y="72" fill="#66727C" font-size="16" font-weight="400" font-family="Arial,sans-serif" text-anchor="start">Датированная редакционная схема, не число атак</text>
<rect x="25" y="112" width="225" height="164" rx="11" fill="#FFFFFF"/>
<rect x="25" y="112" width="5" height="164" rx="2" fill="#2A6383"/>
<text x="42" y="142" fill="#173A51" font-size="21" font-weight="700" font-family="Arial,sans-serif" text-anchor="start">Сентябрь</text>
<text x="42" y="170" fill="#2D3744" font-size="18" font-weight="600" font-family="Arial,sans-serif" text-anchor="start">Оценка угрозы</text>
<text x="42" y="208" fill="#66727C" font-size="17" font-weight="400" font-family="Arial,sans-serif" text-anchor="start">Частота новостей</text>
<text x="42" y="229" fill="#66727C" font-size="17" font-weight="400" font-family="Arial,sans-serif" text-anchor="start">не равна атакам</text>
<rect x="270" y="112" width="225" height="164" rx="11" fill="#FFFFFF"/>
<rect x="270" y="112" width="5" height="164" rx="2" fill="#2A6383"/>
<text x="287" y="142" fill="#173A51" font-size="21" font-weight="700" font-family="Arial,sans-serif" text-anchor="start">Октябрь</text>
<text x="287" y="170" fill="#2D3744" font-size="18" font-weight="600" font-family="Arial,sans-serif" text-anchor="start">Атаки на транспорт</text>
<text x="287" y="208" fill="#66727C" font-size="17" font-weight="400" font-family="Arial,sans-serif" text-anchor="start">Транспорт, жильё</text>
<text x="287" y="229" fill="#66727C" font-size="17" font-weight="400" font-family="Arial,sans-serif" text-anchor="start">и гражданские службы</text>
<rect x="515" y="112" width="225" height="164" rx="11" fill="#FFFFFF"/>
<rect x="515" y="112" width="5" height="164" rx="2" fill="#2A6383"/>
<text x="532" y="142" fill="#173A51" font-size="21" font-weight="700" font-family="Arial,sans-serif" text-anchor="start">Начало ноября</text>
<text x="532" y="170" fill="#2D3744" font-size="18" font-weight="600" font-family="Arial,sans-serif" text-anchor="start">Удары по рейсам</text>
<text x="532" y="208" fill="#66727C" font-size="17" font-weight="400" font-family="Arial,sans-serif" text-anchor="start">Свет, связь</text>
<text x="532" y="229" fill="#66727C" font-size="17" font-weight="400" font-family="Arial,sans-serif" text-anchor="start">и пассажирские рейсы</text>
<rect x="760" y="112" width="225" height="164" rx="11" fill="#FFFFFF"/>
<rect x="760" y="112" width="5" height="164" rx="2" fill="#2A6383"/>
<text x="777" y="142" fill="#173A51" font-size="21" font-weight="700" font-family="Arial,sans-serif" text-anchor="start">13 ноября</text>
<text x="777" y="170" fill="#2D3744" font-size="18" font-weight="600" font-family="Arial,sans-serif" text-anchor="start">Режим автобусов</text>
<text x="777" y="208" fill="#66727C" font-size="17" font-weight="400" font-family="Arial,sans-serif" text-anchor="start">С 19 ноября</text>
<text x="777" y="229" fill="#66727C" font-size="17" font-weight="400" font-family="Arial,sans-serif" text-anchor="start">вводится новый режим</text></svg>
