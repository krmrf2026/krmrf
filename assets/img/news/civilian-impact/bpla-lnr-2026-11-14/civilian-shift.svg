<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="310" viewBox="0 0 1000 310" role="img" aria-labelledby="title2 desc2"><title id="title2">Как менялись гражданские последствия с сентября по ноябрь</title><desc id="desc2">Четыре этапа: сентябрьские угрозы, октябрьские последствия, тяжёлые эпизоды начала ноября, ограничения транспорта с 19 ноября.</desc><rect width="1000" height="310" fill="white"/><text x="35" y="36" font-size="24" font-family="Arial,sans-serif" font-weight="bold" fill="#23384c">От происшествий к изменению правил</text><rect x="40" y="70" width="232" height="166" rx="12" fill="#f4f6f8" stroke="#ccd6e0"/><text x="57" y="101" font-size="20" font-family="Arial,sans-serif" font-weight="bold" fill="#284f70">Сентябрь</text><text x="57" y="142" font-size="16" font-family="Arial,sans-serif" fill="#354455">Риски сохраняются</text><text x="57" y="166" font-size="16" font-family="Arial,sans-serif" fill="#354455">даже при снижении</text><text x="57" y="190" font-size="16" font-family="Arial,sans-serif" fill="#354455">частоты сообщений</text><text x="275" y="162" font-size="24" font-family="Arial,sans-serif" fill="#8398ab">›</text><rect x="284" y="70" width="232" height="166" rx="12" fill="#f4f6f8" stroke="#ccd6e0"/><text x="301" y="101" font-size="20" font-family="Arial,sans-serif" font-weight="bold" fill="#284f70">Октябрь</text><text x="301" y="142" font-size="16" font-family="Arial,sans-serif" fill="#354455">Транспорт, жильё,</text><text x="301" y="166" font-size="16" font-family="Arial,sans-serif" fill="#354455">связь и отдельные</text><text x="301" y="190" font-size="16" font-family="Arial,sans-serif" fill="#354455">ограничения перевозок</text><text x="519" y="162" font-size="24" font-family="Arial,sans-serif" fill="#8398ab">›</text><rect x="528" y="70" width="232" height="166" rx="12" fill="#f4f6f8" stroke="#ccd6e0"/><text x="545" y="101" font-size="20" font-family="Arial,sans-serif" font-weight="bold" fill="#284f70">2–10 ноября</text><text x="545" y="142" font-size="16" font-family="Arial,sans-serif" fill="#354455">Автобусы, связь,</text><text x="545" y="166" font-size="16" font-family="Arial,sans-serif" fill="#354455">энергетика; новые</text><text x="545" y="190" font-size="16" font-family="Arial,sans-serif" fill="#354455">тяжёлые последствия</text><text x="763" y="162" font-size="24" font-family="Arial,sans-serif" fill="#8398ab">›</text><rect x="772" y="70" width="232" height="166" rx="12" fill="#f4f6f8" stroke="#ccd6e0"/><text x="789" y="101" font-size="20" font-family="Arial,sans-serif" font-weight="bold" fill="#284f70">13 ноября</text><text x="789" y="142" font-size="16" font-family="Arial,sans-serif" fill="#354455">С 19 ноября —</text><text x="789" y="166" font-size="16" font-family="Arial,sans-serif" fill="#354455">ограничение движения</text><text x="789" y="190" font-size="16" font-family="Arial,sans-serif" fill="#354455">межрегиональных рейсов</text><text x="40" y="275" font-size="13" font-family="Arial,sans-serif" fill="#657484">Схема редакции KRM РФ. Это изменения последствий и решений, а не оценка числа запусков БПЛА.</text></svg>