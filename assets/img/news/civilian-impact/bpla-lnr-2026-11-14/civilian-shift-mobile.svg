<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 820" width="640" height="820" role="img" aria-labelledby="tt td"><title id="tt">Как менялась гражданская обстановка с сентября по ноябрь 2026</title><desc id="td">Четыре этапа: сентябрь, октябрь, начало ноября, объявление 13 ноября новых ограничений.</desc><rect width="640" height="820" fill="white"/><text x="25" y="47" font-size="30" font-family="Arial,sans-serif" font-weight="bold" fill="#23384c">От происшествий к правилам</text><rect x="25" y="83" width="590" height="152" rx="12" fill="#f4f6f8" stroke="#ccd6e0"/><text x="48" y="123" font-size="27" font-family="Arial,sans-serif" font-weight="bold" fill="#284f70">Сентябрь</text><text x="48" y="166" font-size="23" font-family="Arial,sans-serif" fill="#354455">Риски сохраняются, даже когда</text><text x="48" y="197" font-size="23" font-family="Arial,sans-serif" fill="#354455">снижается число сообщений</text><rect x="25" y="260" width="590" height="152" rx="12" fill="#f4f6f8" stroke="#ccd6e0"/><text x="48" y="300" font-size="27" font-family="Arial,sans-serif" font-weight="bold" fill="#284f70">Октябрь</text><text x="48" y="343" font-size="23" font-family="Arial,sans-serif" fill="#354455">Транспорт, жильё, связь;</text><text x="48" y="374" font-size="23" font-family="Arial,sans-serif" fill="#354455">ограничения отдельных перевозок</text><rect x="25" y="437" width="590" height="152" rx="12" fill="#f4f6f8" stroke="#ccd6e0"/><text x="48" y="477" font-size="27" font-family="Arial,sans-serif" font-weight="bold" fill="#284f70">2–10 ноября</text><text x="48" y="520" font-size="23" font-family="Arial,sans-serif" fill="#354455">Атаки на автобусы, связь и</text><text x="48" y="551" font-size="23" font-family="Arial,sans-serif" fill="#354455">энергетику, тяжёлые последствия</text><rect x="25" y="614" width="590" height="152" rx="12" fill="#f4f6f8" stroke="#ccd6e0"/><text x="48" y="654" font-size="27" font-family="Arial,sans-serif" font-weight="bold" fill="#284f70">13 ноября</text><text x="48" y="697" font-size="23" font-family="Arial,sans-serif" fill="#354455">С 19 ноября меняется режим</text><text x="48" y="728" font-size="23" font-family="Arial,sans-serif" fill="#354455">межрегиональных автобусных рейсов</text></svg>