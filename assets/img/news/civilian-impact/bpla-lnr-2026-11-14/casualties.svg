<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc">
<title id="title">Гражданские потери по опубликованным недельным сведениям</title>
<desc id="desc">5 недель с 5 октября по 8 ноября: погибшие 19,7,12,9,17, раненые 51,36,28,10,57. Данные последней недели требуют независимой сверки.</desc>
<rect x="0" y="0" width="1000" height="460" rx="0" fill="#F7F8F7"/>
<text x="32" y="42" fill="#173A51" font-size="27" font-weight="700" font-family="Arial,sans-serif" text-anchor="start">Гражданские потери: пять недель</text>
<text x="32" y="69" fill="#66727C" font-size="16" font-weight="400" font-family="Arial,sans-serif" text-anchor="start">По опубликованным недельным сводкам ЛНР</text>
<rect x="32" y="92" width="16" height="16" rx="3" fill="#C5684E"/>
<text x="57" y="106" fill="#2D3744" font-size="17" font-weight="400" font-family="Arial,sans-serif" text-anchor="start">Погибли</text>
<rect x="174" y="92" width="16" height="16" rx="3" fill="#2A6383"/>
<text x="200" y="106" fill="#2D3744" font-size="17" font-weight="400" font-family="Arial,sans-serif" text-anchor="start">Ранены</text>
<text x="33" y="166" fill="#22313F" font-size="19" font-weight="600" font-family="Arial,sans-serif" text-anchor="start">5–11 окт.</text>
