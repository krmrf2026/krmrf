<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc"><title id="title">Погибшие и раненые мирные жители ЛНР по пяти неделям, октябрь — ноябрь 2026 года</title><desc id="desc">За 5–11 октября: 19 погибших, 51 раненый; 12–18 октября: 7 и 36; 19–25 октября: 12 и 28; 26 октября — 1 ноября: 9 и 10; 2–8 ноября: 17 и 57.</desc><rect width="1000" height="420" fill="#ffffff"/><text x="35" y="32" fill="#223344" font-size="24" font-family="Arial,sans-serif" font-weight="bold">Пять недель гражданских последствий</text><text x="35" y="58" fill="#576475" font-size="14" font-family="Arial,sans-serif">Число людей по опубликованным недельным сводкам, не число атак</text><line x1="65" x2="960" y1="320" y2="320" stroke="#e4e9ef"/><text x="45" y="325" fill="#627285" font-size="13" text-anchor="end" font-family="Arial,sans-serif">0</text><line x1="65" x2="960" y1="240" y2="240" stroke="#e4e9ef"/><text x="45" y="245" fill="#627285" font-size="13" text-anchor="end" font-family="Arial,sans-serif">20</text><line x1="65" x2="960" y1="160" y2="160" stroke="#e4e9ef"/><text x="45" y="165" fill="#627285" font-size="13" text-anchor="end" font-family="Arial,sans-serif">40</text><line x1="65" x2="960" y1="80" y2="80" stroke="#e4e9ef"/><text x="45" y="85" fill="#627285" font-size="13" text-anchor="end" font-family="Arial,sans-serif">60</text><rect x="105" y="244" width="40" height="76" rx="3" fill="#315d83"/><text x="125" y="235" text-anchor="middle" font-size="18" font-family="Arial,sans-serif" fill="#222c37" font-weight="bold">19</text><rect x="159" y="116" width="40" height="204" rx="3" fill="#d07859"/><text x="179" y="107" text-anchor="middle" font-size="18" font-family="Arial,sans-serif" fill="#222c37" font-weight="bold">51</text><text x="149" y="348" text-anchor="middle" font-size="15" font-family="Arial,sans-serif" fill="#273747">5–11 окт.</text><rect x="285" y="292" width="40" height="28" rx="3" fill="#315d83"/><text x="305" y="283" text-anchor="middle" font-size="18" font-family="Arial,sans-serif" fill="#222c37" font-weight="bold">7</text><rect x="339" y="176" width="40" height="144" rx="3" fill="#d07859"/><text x="359" y="167" text-anchor="middle" font-size="18" font-family="Arial,sans-serif" fill="#222c37" font-weight="bold">36</text><text x="329" y="348" text-anchor="middle" font-size="15" font-family="Arial,sans-serif" fill="#273747">12–18 окт.</text><rect x="465" y="272" width="40" height="48" rx="3" fill="#315d83"/><text x="485" y="263" text-anchor="middle" font-size="18" font-family="Arial,sans-serif" fill="#222c37" font-weight="bold">12</text><rect x="519" y="208" width="40" height="112" rx="3" fill="#d07859"/><text x="539" y="199" text-anchor="middle" font-size="18" font-family="Arial,sans-serif" fill="#222c37" font-weight="bold">28</text><text x="509" y="348" text-anchor="middle" font-size="15" font-family="Arial,sans-serif" fill="#273747">19–25 окт.</text><rect x="645" y="284" width="40" height="36" rx="3" fill="#315d83"/><text x="665" y="275" text-anchor="middle" font-size="18" font-family="Arial,sans-serif" fill="#222c37" font-weight="bold">9</text><rect x="699" y="280" width="40" height="40" rx="3" fill="#d07859"/><text x="719" y="271" text-anchor="middle" font-size="18" font-family="Arial,sans-serif" fill="#222c37" font-weight="bold">10</text><text x="689" y="348" text-anchor="middle" font-size="15" font-family="Arial,sans-serif" fill="#273747">26 окт.–1 ноя.</text><rect x="825" y="252" width="40" height="68" rx="3" fill="#315d83"/><text x="845" y="243" text-anchor="middle" font-size="18" font-family="Arial,sans-serif" fill="#222c37" font-weight="bold">17</text><rect x="879" y="92" width="40" height="228" rx="3" fill="#d07859"/><text x="899" y="83" text-anchor="middle" font-size="18" font-family="Arial,sans-serif" fill="#222c37" font-weight="bold">57</text><text x="869" y="348" text-anchor="middle" font-size="15" font-family="Arial,sans-serif" fill="#273747">2–8 ноя.</text><rect x="670" y="29" width="14" height="14" fill="#315d83"/><text x="691" y="42" font-size="14" font-family="Arial,sans-serif" fill="#223344">Погибли</text><rect x="790" y="29" width="14" height="14" fill="#d07859"/><text x="811" y="42" font-size="14" font-family="Arial,sans-serif" fill="#223344">Ранены</text><text x="35" y="390" fill="#677586" font-size="12" font-family="Arial,sans-serif">12–18 октября: 36 раненых по сообщению омбудсмена ЛНР. Данные могут уточняться.</text></svg>