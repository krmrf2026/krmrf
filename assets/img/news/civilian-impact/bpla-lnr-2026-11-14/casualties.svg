<rect x="235" y="169" width="484.5" height="18" rx="4" fill="#2A6383"/>
<text x="729.5" y="184" fill="#2D3744" font-size="17" font-weight="700" font-family="Arial,sans-serif" text-anchor="start">51</text>
<text x="33" y="218" fill="#22313F" font-size="19" font-weight="600" font-family="Arial,sans-serif" text-anchor="start">12–18 окт.</text>
