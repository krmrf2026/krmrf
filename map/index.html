<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KRM РФ - Оперативная карта</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/page-map.css">
</head>

<body>

<!-- HEADER (узкий контейнер как на главной) -->
<div class="wrap">
  <h1>KRM РФ</h1>
  <div class="subtitle">Обстановка и аналитика</div>

  <nav class="main-nav">
    <a href="../">Главная</a>
    <span class="divider">|</span>
    <a href="./" class="active">Карта</a>
    <span class="divider">|</span>
    <a href="../news/">Архив</a>
  </nav>

  <div class="nav-rule"></div>

  <div class="map-title-row">
    <h2>Оперативная карта</h2>
    <button class="btn" id="openFullscreenBtn">Развернуть</button>
  </div>
</div>

<!-- MAP (широкий контейнер как раньше) -->
<div class="map-wide">
  <div class="map-container" id="mapWrapper">
    <div id="map"></div>
    <button id="exitFullscreenBtn">Свернуть</button>
  </div>

  <div class="map-footnote">
    Данные собраны из открытых источников. Карта обновляется вручную.
    Отображение носит ориентировочный характер. Используются картографические данные © OpenStreetMap.
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="../assets/js/map.js" defer></script>

</body>
</html>
