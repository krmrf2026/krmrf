name: Private KRM analytics
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
concurrency:
  group: private-analytics
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Require a private repository
        env:
          IS_PRIVATE: ${{ github.event.repository.private }}
        run: test "$IS_PRIVATE" = true
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Export and refresh recent days
        env:
          METRIKA_OAUTH_TOKEN: ${{ secrets.METRIKA_OAUTH_TOKEN }}
          METRIKA_COUNTER_ID: '110383043'
        run: |
          if [ "$(TZ=Europe/Moscow date +%u)" = 1 ]; then
            python3 collect_metrika.py --lookback 7 --extended
          else
            python3 collect_metrika.py --lookback 7
          fi
      - name: Persist aggregates and history
        run: |
          git config user.name 'KRM Analytics'
          git config user.email 'analytics@users.noreply.github.com'
          git add data reports
          if ! git diff --cached --quiet; then
            git commit -m 'Update aggregate analytics'
            git push
          fi
      - name: Show the report
        run: cat reports/latest.md >> "$GITHUB_STEP_SUMMARY"
      - name: Weekly notification in this private repository
        if: ${{ github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$(TZ=Europe/Moscow date +%u)" != 1 ]; then exit 0; fi
          report_date=$(TZ=Europe/Moscow date +%F)
          report_title="KRM weekly analytics $report_date"
          issue_number=$(gh issue list --state all --search "$report_title in:title" --json number,title --jq ".[] | select(.title == \"$report_title\") | .number" | head -1)
          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" --body-file reports/latest.md
          else
            gh issue create --title "$report_title" --body-file reports/latest.md
          fi
