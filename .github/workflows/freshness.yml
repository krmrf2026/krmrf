name: Guide freshness

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Editorial queue and critical metadata checks
        run: npm run guides:report -- --strict-warning
      - name: Job summary
        if: always()
        run: |
          if [ -f ops/editorial-review.md ]; then
            cat ops/editorial-review.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-review
          path: |
            ops/editorial-review.json
            ops/editorial-review.md
          retention-days: 14
          if-no-files-found: warn
