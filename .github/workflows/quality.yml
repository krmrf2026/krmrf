name: Quality

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

concurrency:
  group: quality-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y imagemagick librsvg2-bin
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run qa:visible
      - name: Record public file checksums
        run: (cd dist && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) > .cache/public-sha256.txt
      - name: Save QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cache/qa-last.log
            .cache/public-sha256.txt
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
      - name: Benchmark search with an emulated slow connection
        if: github.event_name == 'workflow_dispatch'
        run: npm run lab:search
      - name: Save search measurements
        if: github.event_name == 'workflow_dispatch' && success()
        uses: actions/upload-artifact@v4
        with:
          name: search-lab-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/search-lab.json
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
      - name: Prepared publication links
        run: node tools/publish-links.mjs --summary >> "$GITHUB_STEP_SUMMARY"
