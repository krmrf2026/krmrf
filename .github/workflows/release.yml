name: Release archives

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y imagemagick unzip
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run release
        env:
          KRM_RELEASE_DIR: ${{ runner.temp }}/krmrf-release-output
      - uses: actions/upload-artifact@v4
        with:
          name: krmrf-release
          path: ${{ runner.temp }}/krmrf-release-output/
          if-no-files-found: error
