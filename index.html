<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Тихая газетка</title>

  <style>
    :root {
      --bg: #f6f5f4;
      --text: #1f2328;
      --muted: #5f6772;
      --rule: #e6e4e1;
      --link: #1a5fb4;
      --linkHover: #0f4c9a;
      --title: #1b1f24;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Ubuntu, system-ui, sans-serif;
      line-height: 1.7;
    }

    .wrap {
      max-width: 720px;
      padding: 18px 14px 64px;
      margin: 0 auto;
    }

    header h1 {
      font-size: 22px;
      margin: 0 0 6px 0;
      font-weight: 700;
      color: var(--title);
    }

    header p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    nav {
      margin: 20px 0;
      font-size: 16px;
    }

    nav a {
      display: inline-block;
      margin-right: 20px;
      text-decoration: none;
      color: var(--link);
      font-weight: 600;
    }

    nav a:hover {
      color: var(--linkHover);
      text-decoration: underline;
    }

    footer {
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid var(--rule);
      font-size: 14px;
      color: var(--muted);
    }

    footer a {
      color: var(--link);
      text-decoration: none;
      font-weight: 600;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="wrap">

    <header>
      <h1>Тихая газетка</h1>
      <p>Аналитика СВО & Новости ЛНР & Кременная</p>

      <nav>
        <a href="https://krmrf.pages.dev/map">Карта</a>
        <a href="#">Новости Кременной</a>
      </nav>
    </header>

    <footer>
      <p>
        <a href="https://t.me/xykrm" target="_blank">
          Ссылка на мой Telegram
        </a>
      </p>
    </footer>

  </div>
</body>
</html>
