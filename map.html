<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Контроль территории</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html, body {
    height: 100%;
    margin: 0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: #f3f4f6;
}

#map {
    width: 100%;
    height: 100vh;
}
</style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

<script>

// Инициализация карты
const map = L.map('map', {
    preferCanvas: true,
    zoomControl: true
}).setView([48.7, 38.2], 6);

// Светлая минималистичная база
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap'
}).addTo(map);

// Мягкая профессиональная палитра
const COLORS = {
    russian: {
        fill: "#b63a3a",
        outline: "#5a1515"
    },
    ukrainian: {
        fill: "#2e5fa7",
        outline: "#1c3d6e"
    }
};

// Загрузка и автоматическое объединение
fetch('zones.geojson')
.then(r => r.json())
.then(data => {

    // --- РОССИЙСКИЙ КОНТРОЛЬ ---
    const russianFeatures = data.features.filter(f =>
        f.geometry &&
        f.properties?.name?.toLowerCase().includes("russian")
    );

    if (russianFeatures.length > 0) {

        let mergedRussian = russianFeatures[0];

        for (let i = 1; i < russianFeatures.length; i++) {
            mergedRussian = turf.union(mergedRussian, russianFeatures[i]);
        }

        L.geoJSON(mergedRussian, {
            style: {
                fillColor: COLORS.russian.fill,
                fillOpacity: 0.42,
                color: COLORS.russian.outline,
                weight: 2
            }
        }).addTo(map);

        map.fitBounds(L.geoJSON(mergedRussian).getBounds(), { padding: [20,20] });
    }

    // --- УКРАИНСКИЙ КОНТРОЛЬ (если нужен) ---
    const ukrainianFeatures = data.features.filter(f =>
        f.geometry &&
        f.properties?.name?.toLowerCase().includes("ukrainian")
    );

    if (ukrainianFeatures.length > 0) {

        let mergedUkrainian = ukrainianFeatures[0];

        for (let i = 1; i < ukrainianFeatures.length; i++) {
            mergedUkrainian = turf.union(mergedUkrainian, ukrainianFeatures[i]);
        }

        L.geoJSON(mergedUkrainian, {
            style: {
                fillColor: COLORS.ukrainian.fill,
                fillOpacity: 0.42,
                color: COLORS.ukrainian.outline,
                weight: 2
            }
        }).addTo(map);
    }

})
.catch(err => console.error(err));

</script>

</body>
</html>
