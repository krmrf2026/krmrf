<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карта</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html, body {
    height: 100%;
    margin: 0;
    font-family: Ubuntu, system-ui, sans-serif;
    background: #f4f4f4;
}

#map {
    width: 100%;
    height: 100vh;
}
</style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// ===== ИНИЦИАЛИЗАЦИЯ =====
var map = L.map('map', {
    preferCanvas: true
}).setView([48.7, 38.2], 6);


// ===== БАЗОВАЯ КАРТА =====
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap'
}).addTo(map);


// ===== ФУНКЦИЯ ЦВЕТА ЗОН =====
function getColor(name) {
    if (!name) return "#0057b7";
    const n = name.toLowerCase();
    if (n.includes("russian")) return "#c44545";
    if (n.includes("ukrainian")) return "#0057b7";
    return "#0057b7";
}


// ===== СЛОЙ ЗОН =====
var zonesLayer = L.geoJSON(null, {
    filter: function(feature) {
        return feature.geometry.type === "Polygon" ||
               feature.geometry.type === "MultiPolygon";
    },
    style: function(feature) {
        const name = feature.properties?.name || "";
        const color = getColor(name);

        return {
            stroke: false,
            fillColor: color,
            fillOpacity: 0.45
        };
    }
}).addTo(map);


// ===== ЗАГРУЗКА ЗОН =====
fetch('zones.geojson')
    .then(response => response.json())
    .then(data => {
        zonesLayer.addData(data);
        if (zonesLayer.getBounds().isValid()) {
            map.fitBounds(zonesLayer.getBounds());
        }
    })
    .catch(error => console.error("Ошибка загрузки zones:", error));


// ===== КОНТУР ОБЛАСТЕЙ =====
var regionsBorderLayer = L.geoJSON(null, {
    style: function() {
        return {
            color: "#c44545",   // мягкий красный
            weight: 3,          // толщина линии
            opacity: 0.95,
            fillOpacity: 0
        };
    }
}).addTo(map);


// ===== ЗАГРУЗКА КОНТУРА =====
fetch('rf_regions.json')
    .then(response => response.json())
    .then(data => {
        regionsBorderLayer.addData(data);
        regionsBorderLayer.bringToFront();
    })
    .catch(error => console.error("Ошибка загрузки контуров:", error));

</script>

</body>
</html>
