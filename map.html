<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Контроль территории</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html, body {
    height: 100%;
    margin: 0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: #f3f4f6;
}

#map {
    width: 100%;
    height: 100vh;
}
</style>
</head>

<body>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// --- Инициализация ---
const map = L.map('map', {
    preferCanvas: true
}).setView([48.7, 38.2], 6);

// --- Базовая карта ---
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap'
}).addTo(map);

// --- Загрузка данных ---
fetch('zones.geojson')
.then(r => r.json())
.then(data => {

    // 1. Основная заливка (без внутренних границ)
    const fillLayer = L.geoJSON(data, {

        filter: f =>
            f.geometry &&
            (f.geometry.type === "Polygon" ||
             f.geometry.type === "MultiPolygon"),

        style: {
            stroke: false,              // Убираем ВСЕ внутренние линии
            fillColor: "#b63a3a",       // мягкий современный красный
            fillOpacity: 0.42           // аккуратная прозрачность
        }

    }).addTo(map);

    // 2. Внешний контур (аккуратный, темнее)
    const outlineLayer = L.geoJSON(data, {
        style: {
            color: "#5a1515",
            weight: 2,
            opacity: 0.9,
            fill: false
        }
    }).addTo(map);

    // 3. Автоцентрирование
    if (fillLayer.getBounds().isValid()) {
        map.fitBounds(fillLayer.getBounds(), { padding: [20, 20] });
    }

})
.catch(err => console.error(err));

</script>

</body>
</html>
