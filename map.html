<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Карта</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    html, body {
      height: 100%;
      margin: 0;
    }
    #map {
      height: 100vh;
    }
  </style>
</head>
<body>

<div id="map"></div>

<script>
window.addEventListener('load', async () => {

  // Центр карты (Донбасс), масштаб 7
  const map = L.map('map').setView([48.7, 38.2], 7);

  // Русская подложка OpenStreetMap
  L.tileLayer('https://{s}.tile.openstreetmap.ru/osm/{z}/{x}/{y}.png', {
    maxZoom: 18,
    attribution: '© OpenStreetMap'
  }).addTo(map);

  // Загружаем линию фронта (GeoJSON)
  try {
    const res = await fetch('/data/frontline.geojson', { cache: 'no-store' });
    if (!res.ok) throw new Error('frontline.geojson not found');

    const geo = await res.json();

    L.geoJSON(geo, {
      style: {
        color: '#cc0000',
        weight: 3
      }
    }).addTo(map);

  } catch (e) {
    console.log(e);
  }

});
</script>

</body>
</html>
