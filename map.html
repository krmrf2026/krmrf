<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карта</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html, body {
    height: 100%;
    margin: 0;
    font-family: Ubuntu, system-ui, sans-serif;
}

#map {
    width: 100%;
    height: 100vh;
}
</style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// Инициализация карты
var map = L.map('map', {
    preferCanvas: true
}).setView([48.7, 38.2], 6);

// Базовый слой
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap'
}).addTo(map);

// Функция определения цвета
function getColor(name) {

    if (!name) return "#0057b7"; // если вдруг нет имени — делаем синим

    name = name.toLowerCase();

    if (name.includes("russian"))
        return "#d90429";   // красный

    if (name.includes("ukrainian"))
        return "#0057b7";   // синий

    return "#0057b7"; // всё остальное тоже синим, чтобы не было серых
}

// Создаем слой GeoJSON
var geoLayer = L.geoJSON(null, {

    // Оставляем только полигоны
    filter: function(feature) {
        return feature.geometry.type === "Polygon" ||
               feature.geometry.type === "MultiPolygon";
    },

    style: function(feature) {

        const name = feature.properties?.name || "";

        return {
            color: getColor(name),
            fillColor: getColor(name),
            weight: 2,
            fillOpacity: 0.35
        };
    },

    onEachFeature: function(feature, layer) {

        const name = feature.properties?.name || "Объект";
        layer.bindPopup("<b>" + name + "</b>");
    }

}).addTo(map);

// Загружаем GeoJSON
fetch('zones.geojson')
    .then(response => response.json())
    .then(data => {

        geoLayer.addData(data);

        if (geoLayer.getBounds().isValid()) {
            map.fitBounds(geoLayer.getBounds());
        }

    })
    .catch(error => {
        console.error("Ошибка загрузки GeoJSON:", error);
    });

</script>

</body>
</html>
