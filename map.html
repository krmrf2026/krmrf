<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карта</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html, body {
    height: 100%;
    margin: 0;
    font-family: Ubuntu, system-ui, sans-serif;
    background: #f4f4f4;
}

#map {
    width: 100%;
    height: 100vh;
}

.region-tooltip {
    background: rgba(0,0,0,0.85);
    color: #fff;
    border: none;
    padding: 6px 10px;
    font-size: 14px;
    border-radius: 4px;
}
</style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

<script>

// ===== ИНИЦИАЛИЗАЦИЯ =====
var map = L.map('map', {
    preferCanvas: true
}).setView([48.7, 38.2], 6);

// ===== БАЗОВАЯ КАРТА =====
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap'
}).addTo(map);

// ===== ЦВЕТ ЗОН =====
function getColor(name) {
    if (!name) return "#0057b7";
    const n = name.toLowerCase();
    if (n.includes("russian")) return "#c44545";
    if (n.includes("ukrainian")) return "#0057b7";
    return "#0057b7";
}

// ===== СЛОЙ ЗОН =====
var zonesLayer = L.geoJSON(null, {
    style: function(feature) {
        const name = feature.properties?.name || "";
        return {
            stroke: false,
            fillColor: getColor(name),
            fillOpacity: 0.45
        };
    }
}).addTo(map);

let zonesData = null;

fetch('zones.geojson')
    .then(r => r.json())
    .then(data => {
        zonesData = data;
        zonesLayer.addData(data);
        if (zonesLayer.getBounds().isValid()) {
            map.fitBounds(zonesLayer.getBounds());
        }
    });


// ===== ПЕРЕИМЕНОВАНИЕ ОБЛАСТЕЙ =====
function getCustomName(name) {
    if (name.includes("Луган")) return "ЛНР";
    if (name.includes("Донец")) return "ДНР";
    if (name.includes("Запорож")) return "Запорожская область";
    if (name.includes("Херсон")) return "Херсонская область";
    return name;
}


// ===== ПОДСЧЁТ ПРОЦЕНТА КОНТРОЛЯ РФ =====
function calculateControlledPercent(regionFeature) {

    if (!zonesData) return "...";

    let regionArea = turf.area(regionFeature);
    let controlledArea = 0;

    zonesData.features.forEach(zone => {

        if (zone.properties?.name?.toLowerCase().includes("russian")) {

            let intersection = turf.intersect(regionFeature, zone);

            if (intersection) {
                controlledArea += turf.area(intersection);
            }
        }

    });

    let percent = (controlledArea / regionArea) * 100;
    return percent.toFixed(1);
}


// ===== HOVER =====
function onEachRegion(feature, layer) {

    layer.on({

        mouseover: function() {

            let percent = calculateControlledPercent(feature);
            let displayName = getCustomName(feature.properties.name_ru);

            layer.setStyle({
                weight: 3.5,
                color: "#7a1f1f"
            });

            layer.bindTooltip(
                displayName +
                "<br>Под контролем РФ: " + percent + "%",
                {
                    sticky: true,
                    direction: "top",
                    className: "region-tooltip"
                }
            ).openTooltip();
        },

        mouseout: function(e) {
            regionsBorderLayer.resetStyle(e.target);
            layer.closeTooltip();
        }

    });
}


// ===== КОНТУР ОБЛАСТЕЙ =====
var regionsBorderLayer = L.geoJSON(null, {
    style: function() {
        return {
            color: "#4a0d0d",
            weight: 2.5,
            opacity: 0.95,
            fillOpacity: 0
        };
    },
    onEachFeature: onEachRegion
}).addTo(map);


fetch('rf_regions.json')
    .then(r => r.json())
    .then(data => {
        regionsBorderLayer.addData(data);
        regionsBorderLayer.bringToFront();
    });

</script>

</body>
</html>
