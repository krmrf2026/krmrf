<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Контроль территории</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html, body {
    height: 100%;
    margin: 0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: #f4f4f4;
}

#map {
    width: 100%;
    height: 100vh;
}
</style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// Инициализация
const map = L.map('map', {
    preferCanvas: true,
    zoomControl: false
}).setView([48.7, 38.2], 6);

// Минималистичная светлая база
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap'
}).addTo(map);

// Спокойная палитра
function getColor(name) {
    if (!name) return "#2e5fa7";

    const n = name.toLowerCase();

    if (n.includes("russian"))
        return "#b63a3a";   // глубокий мягкий красный

    if (n.includes("ukrainian"))
        return "#2e5fa7";   // спокойный синий

    return "#2e5fa7";
}

// Основной слой без внутренних границ
const geoLayer = L.geoJSON(null, {

    filter: f =>
        f.geometry.type === "Polygon" ||
        f.geometry.type === "MultiPolygon",

    style: f => ({
        stroke: false,           // убираем внутренние линии
        fillColor: getColor(f.properties?.name),
        fillOpacity: 0.42        // чистая прозрачность без швов
    })

}).addTo(map);

// Загрузка
fetch('zones.geojson')
.then(r => r.json())
.then(data => {

    geoLayer.addData(data);

    // Внешний контур (один аккуратный)
    L.geoJSON(data, {
        style: {
            color: "#5a1515",    // тёмный бордовый
            weight: 1.8,
            opacity: 0.9,
            fill: false
        }
    }).addTo(map);

    if (geoLayer.getBounds().isValid()) {
        map.fitBounds(geoLayer.getBounds(), { padding: [20, 20] });
    }

});

</script>

</body>
</html>
