<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карта</title>

<script src="https://api-maps.yandex.ru/2.1/?lang=ru_RU" type="text/javascript"></script>

<style>
html, body {
    height: 100%;
    margin: 0;
}
#map {
    width: 100%;
    height: 100vh;
}
</style>
</head>

<body>

<div id="map"></div>

<script>
ymaps.ready(function () {

    var map = new ymaps.Map("map", {
        center: [48.7, 38.2],
        zoom: 7,
        controls: ['zoomControl']
    });

    // Пример линии
    var frontline = new ymaps.Polyline([
        [48.6, 38.0],
        [48.7, 38.3],
        [48.8, 38.6]
    ], {}, {
        strokeColor: "#cc0000",
        strokeWidth: 3
    });

    map.geoObjects.add(frontline);

});
</script>

</body>
</html>
